name: Build and Release LaTeX Document

on:
  push:
    tags:
      - 'v*' # 触发条件：推送以 'v' 开头的 tag (如 v1.0.0)

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    # 必须赋予写权限，以便 GitHub Actions 可以创建 Release
    permissions:
      contents: write 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XeLaTeX and Fonts
        run: |
          sudo apt-get update
          # 安装 XeLaTeX 及其常用宏包和中文支持
          sudo apt-get install -y texlive-xetex texlive-latex-extra texlive-fonts-recommended texlive-fonts-extra texlive-lang-chinese texlive-lang-greek
          
          # 安装所需字体：
          # - fonts-noto-cjk / fonts-noto-cjk-extra: 提供 Noto CJK (Sans, Serif, Mono 的 SC 版本)
          # - fonts-linuxlibertine: 提供 Linux Libertine O
          # - fonts-jetbrains-mono: 提供 JetBrains Mono
          sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra fonts-linuxlibertine fonts-jetbrains-mono

      - name: Make build script executable
        run: chmod +x build.sh

      - name: Run build.sh
        run: ./build.sh

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            main.pdf
          generate_release_notes: true